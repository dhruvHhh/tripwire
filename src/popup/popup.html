<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tripwire</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="tw-header">
    <img src="../../icons/icon48.png" alt="" width="28" height="28">
    <h1>Tripwire</h1>
    <span id="host" class="tw-host"></span>
  </header>

  <main>
    <!-- One sentence about the page. A warning about the page itself is the
         loudest thing here; popup.js sets the kind and the wording. -->
    <section id="status" class="status status--neutral">
      <svg aria-hidden="true"><use id="status-icon" href="#i-info"/></svg>
      <div>
        <p id="status-title" class="status-title"></p>
        <p id="status-detail" class="status-detail"></p>
      </div>
    </section>

    <section id="flagged" class="block" aria-labelledby="flagged-heading" hidden>
      <h2 id="flagged-heading">Flagged links <span id="flagged-counts" class="aside"></span></h2>
      <div class="entries">
        <ul id="flagged-list"></ul>
        <button id="flagged-more" type="button" class="more-links" hidden></button>
        <p id="flagged-rest" class="entries-rest" hidden></p>
      </div>
    </section>

    <section class="block" aria-labelledby="modes-heading">
      <div class="block-head">
        <h2 id="modes-heading">Badges on the page</h2>
        <!-- The one-off reveal: every badge, until the page reloads. -->
        <button id="reveal" type="button" class="link-button" hidden>Show all on this page</button>
      </div>
      <div id="fields" class="fields">
        <div id="site-field" class="field" hidden>
          <label for="site-mode">On this site</label>
          <select id="site-mode"></select>
        </div>
        <div class="field">
          <label id="default-label" for="default-mode">On all sites</label>
          <select id="default-mode"></select>
        </div>
      </div>
    </section>

    <!-- Blocklist status. Closed while all is well; opens itself on a problem. -->
    <details id="lists" class="lists">
      <summary>
        <span class="lists-name">Blocklists</span>
        <span id="lists-summary" class="lists-state"></span>
        <svg aria-hidden="true"><use href="#i-chevron"/></svg>
      </summary>
      <div class="lists-body">
        <ul id="lists-sources"></ul>
        <button id="check-now" type="button" class="btn">Check now</button>
      </div>
    </details>
  </main>

  <footer class="tw-footer">
    <span>Links never leave your browser.</span>
    <button id="open-options" type="button" class="link-button">Options</button>
  </footer>

  <!-- Read out by screen readers when a setting or a trusted domain changes. -->
  <p id="announce" class="sr-only" role="status"></p>

  <!-- Icons, defined once. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="i-alert" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 2.5 22.8 21H1.2L12 2.5Zm-1.15 6.7v5.9h2.3V9.2h-2.3Zm0 7.5v2.3h2.3v-2.3h-2.3Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.45 14.3-4.1-4.1 1.5-1.5 2.55 2.55 5.3-5.55 1.55 1.45-6.8 7.15Z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.15 4.6h2.3v2.3h-2.3V6.6Zm0 4.2h2.3v6.6h-2.3v-6.6Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m3.5 6 4.5 4.5L12.5 6"/></symbol>
  </svg>

  <script src="../lib/analyzer.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="../lib/blocklist.js"></script>
  <script src="../lib/trust.js"></script>
  <script src="../lib/findings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
